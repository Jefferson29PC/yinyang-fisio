<script>
(() => {
  const url = ((window.YY_CONFIG || {}).planilhaUrl || '').trim();
  // Aviso no celular da clínica (app ntfy), enviado pelo navegador do paciente — sem nome nem telefone
  const avisarSolicitacao = (d) => {
    try {
      const p = String(d.data || '').split('-');
      const dias = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
      const dia = p.length === 3 ? dias[new Date(+p[0], +p[1] - 1, +p[2]).getDay()] + ', ' + p[2] + '/' + p[1] : d.data;
      fetch('https://ntfy.sh/', { method: 'POST', body: JSON.stringify({
        topic: 'yinyang-fisio-9f6fd6ee7a', title: 'Nova solicitação de avaliação', tags: ['calendar'],
        message: d.tratamento + ' · ' + d.local + ' · ' + dia + ' às ' + d.hora + '\nVeja os dados no e-mail ou na planilha.'
      }) }).catch(() => {});
    } catch (e) {}
  };
  window.YY_ENVIAR = (dados) => {
    if (!url) return Promise.reject(new Error('sem-planilha'));
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(dados) })
      .then((r) => r.json())
      .then((j) => { if (!j || !j.ok) throw new Error((j && j.erro) || 'erro'); avisarSolicitacao(dados); return j; });
  };
  window.YY_OCUPADOS = () => url ? fetch(url + '?acao=ocupados').then((r) => r.json()).then((j) => (j && j.ocupados) || []) : Promise.resolve([]);
})();
</script>

  <!-- Hero -->

            </sc-if>
            <sc-if value="{{formShow}}" hint-placeholder-val="{{ true }}">
              <p style="margin: 0; font-weight: 700; color: #1F331E">3. Escolha a data</p>
              <div style="margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
                <button aria-label="Mês anterior" disabled="{{prevDisabled}}" onClick="{{prevMonth}}" style="{{prevStyle}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>

const YY = (() => {
  const tpl = document.getElementById('yy-tpl');

  const comp = new Component({});
  const getPath = (scope, expr) => {
    expr = expr.trim();
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);

    }

      const m = (node.getAttribute('list') || '').match(whole);
      const list = (m && getPath(scope, m[1])) || [];
      const as = node.getAttribute('as') || 'item';
      const out = [];
      list.forEach((it, i) => { const s = Object.create(scope); s[as] = it; s.$index = i; out.push(...kids(node, s)); });
      return out;
    }
    const svg = node.namespaceURI === 'http://www.w3.org/2000/svg';
    const el = svg ? document.createElementNS(node.namespaceURI, node.tagName) : document.createElement(tag);
    for (const a of Array.from(node.attributes)) {
      const name = a.name;
      if (name.startsWith('hint-')) continue;
      const m = a.value.match(whole);
      if (name.startsWith('on') && m) {
        const fn = getPath(scope, m[1]);
        if (typeof fn === 'function') el.addEventListener(name === 'onchange' ? 'input' : name.slice(2), fn);
        continue;
      }
      if (m) {
        const v = getPath(scope, m[1]);
        if (v === false || v == null) continue;
        el.setAttribute(name, v === true ? '' : String(v));
        if (name === 'value' && 'value' in el) el.value = String(v);
      } else el.setAttribute(name, a.value.includes('{{') ? interp(a.value, scope) : a.value);
    }
    const inner = tag === 'template' ? [] : kids(node, scope);
    inner.forEach((c) => el.appendChild(c));
    return [el];
  }
  function kids(node, scope) { const out = []; node.childNodes.forEach((c) => out.push(...render(c, scope))); return out; }
  const scope = () => Object.assign({}, comp.renderVals());
  window.YY_COMP_DID_MOUNT = () => { if (typeof comp.componentDidMount === 'function') comp.componentDidMount(); };
  function mount() { const s = scope(); kids(tpl.content, s).forEach((n) => app.appendChild(n)); }
  function update() {
    const s = scope();
    const act = document.activeElement; const id = act && act.id; const pos = act && act.selectionStart; const len0 = act && typeof act.value === 'string' ? act.value.length : 0;
    tpl.content.querySelectorAll('[data-region]').forEach((t) => {
      const live = app.querySelector('[data-region="' + t.getAttribute('data-region') + '"]');
      if (live) live.replaceWith(...render(t, s));
    });
    if (id) { const n = document.getElementById(id); if (n) { n.focus(); if (pos != null && n.setSelectionRange) try { const np = Math.max(0, pos + (String(n.value || '').length - len0)); n.setSelectionRange(np, np); } catch (e) {} } }
  }
  return { mount, update };
